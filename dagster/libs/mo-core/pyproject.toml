[project]
name = "mo-core"
version = "0.1.0"
description = "Shared domain models (pydantic) - canonical source for per-DAG Go codegen. Imports no dagster."
requires-python = ">=3.10,<3.15"
dependencies = [
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mo_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
